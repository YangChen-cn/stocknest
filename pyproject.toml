[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockwatch"
version = "1.1.0"
description = "A local, factual US portfolio tracker with OpenBB and daily Gmail reports"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "openbb-core==1.6.13", "openbb-equity==1.6.2", "openbb-yfinance==1.6.3",
  "pandas>=2.2,<3",
  "PyYAML>=6,<7", "pandas-market-calendars>=4.6,<6",
  "pillow>=12.3,<13",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.41,<2", "plotly>=5.24,<7"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["stockwatch*"]

[tool.setuptools.package-data]
stockwatch = ["assets/garden/*.png", "assets/garden/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
