name: Apply report schedules

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stockwatch-scheduler-settings
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install schedule configuration reader
        run: python -m pip install PyYAML==6.0.3
      - name: Apply external report schedules
        env:
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
        run: python -m stockwatch.scheduler_sync
