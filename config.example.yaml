# Copy to config.yaml. This file contains no positions or trading instructions.
portfolio:
  base_currency: USD
  language: en                 # en / zh-CN
  benchmark: SPY              # configurable US stock or ETF price benchmark
notifications:
  email_enabled: true
watchlist: {}                  # targets and alerts are completely optional
imports:
  hsbc:
    enabled: false            # opt in to read-only Gmail execution imports
    allow_email_date: true    # use email date in New York if trade date is absent
    lookback_days: 3
