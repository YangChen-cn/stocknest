# Copy to config.yaml. This file contains no positions or trading instructions.
portfolio:
  base_currency: USD
  language: en                 # en / zh-CN
  benchmark: SPY              # configurable US stock or ETF price benchmark
notifications:
  email_enabled: true
watchlist: {}                  # targets and alerts are completely optional
imports:
  hsbc:
    enabled: false            # opt in to read-only Gmail execution imports
    allow_email_date: true    # use email date in New York if trade date is absent
    lookback_days: 3

# Scheduler switch, editable from the dashboard (locally or on Streamlit Cloud):
# native = GitHub's built-in weekday schedule; cron-job.org = external triggers own
# the exact times, and GitHub's native schedule slots are skipped while selected.
scheduler:
  trigger: native              # native / cron-job.org

# Daily: New York time; weekdays 0=Monday ... 4=Friday.
# Weekly/monthly: Hong Kong time, weekly Saturdays / first monthly weekend day; no weekday selection.
# Changing cloud trigger times requires applying schedules with cron-job.org.
reports:
  INTRADAY: {enabled: true, time: "10:23", days: [0, 1, 2, 3, 4]}
  CLOSE: {enabled: true, time: "18:53", days: [0, 1, 2, 3, 4]}
  WEEKLY: {enabled: false, time: "10:52"}
  MONTHLY: {enabled: false, time: "10:52"}
